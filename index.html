            // 添加分类表单提交
            document.getElementById('addCategoryForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const categoryData = {
                    name: document.getElementById('categoryName').value,
                    description: document.getElementById('categoryDescription').value,
                    icon: document.getElementById('categoryIcon').value,
                    color: document.getElementById('categoryColor').value,
                    tags: document.getElementById('categoryTags').value
                };
                
                addNewCategory(categoryData);
            });
            
            // 关闭添加分类模态框
            document.getElementById('closeAddCategoryModal').addEventListener('click', () => {
                document.getElementById('addCategoryModal').classList.remove('active');
            });
            
            document.getElementById('cancelAddCategory').addEventListener('click', () => {
                document.getElementById('addCategoryModal').classList.remove('active');
            });
            
            // 关闭选择网站模态框
            document.getElementById('closeSelectSiteModal').addEventListener('click', () => {
                document.getElementById('selectSiteModal').classList.remove('active');
                selectedSitesForQuickAccess = [];
            });
            
            document.getElementById('selectSiteModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('selectSiteModal')) {
                    document.getElementById('selectSiteModal').classList.remove('active');
                    selectedSitesForQuickAccess = [];
                }
            });
            
            // 选择网站模态框确认按钮
            document.getElementById('confirmSelectSitesBtn').addEventListener('click', addSelectedSitesToQuickAccess);
            
            // 探索按钮
            document.getElementById('exploreBtn').addEventListener('click', () => {
                document.getElementById('searchInput').focus();
            });
            
            // 关闭确认删除模态框
            document.getElementById('closeConfirmDeleteModal').addEventListener('click', () => {
                document.getElementById('confirmDeleteModal').classList.remove('active');
            });
            
            document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
                document.getElementById('confirmDeleteModal').classList.remove('active');
            });
            
            // 确认删除按钮
            document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
                if (deleteType === 'site') {
                    deleteSite(deleteTargetId, deleteCategoryId);
                } else if (deleteType === 'category') {
                    deleteCategory(deleteTargetId);
                } else if (deleteType === 'favorite') {
                    removeFromQuickAccess(deleteTargetId);
                    document.getElementById('confirmDeleteModal').classList.remove('active');
                } else if (deleteType === 'defaultCategorySites') {
                    deleteDefaultCategorySites(deleteTargetId);
                }
            });
            
            // 数据管理按钮
            document.getElementById('manageDataBtn').addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('确定要重置所有数据吗？这将恢复默认设置并清除所有自定义网站和分类。')) {
                    localStorage.removeItem('categories');
                    localStorage.removeItem('sites');
                    localStorage.removeItem('favoriteSites');
                    
                    categories = defaultCategories;
                    sites = defaultSites;
                    favoriteSites = defaultFavoriteSites;
                    
                    loadQuickAccess();
                    loadCategories();
                    loadCategoryOptions();
                    
                    showToast('数据已重置为默认设置', 'success');
                }
            });
            
            // 关于按钮
            document.getElementById('aboutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                alert('JASPER的个人导航 v2.6\n\n功能特色：\n- 优先使用国内服务自动获取网站图标\n- 支持手动上传本地图片作为图标\n- 完全自定义分类和网站管理\n- 快速访问功能\n- 数据本地存储，支持导入导出\n\n© 2026 JASPER的个人导航');
            });
            
            // 导出数据按钮
            document.getElementById('exportDataBtn').addEventListener('click', (e) => {
                e.preventDefault();
                exportData();
            });
            
            // 导入数据按钮
            document.getElementById('importDataBtn').addEventListener('click', (e) => {
                e.preventDefault();
                importData();
            });
            
            // 刷新分类按钮
            document.getElementById('refreshCategoriesBtn').addEventListener('click', () => {
                loadCategories();
                showToast('分类已刷新', 'success');
            });
        }
    </script>
</body>
</html>
